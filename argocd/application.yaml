apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nks-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Soojong94/ncp-nks-pipeline-practice.git
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
